<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — غير موجود | ديوان</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f3d26, #1a5c3a, #2d7a52);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .code {
      font-size: 120px;
      font-weight: 900;
      color: #d4af37;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
    }
    h1 {
      font-size: 24px;
      margin: 20px 0 10px;
      color: white;
    }
    p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: linear-gradient(135deg, #d4af37, #e8c65a);
      color: #0f3d26;
      text-decoration: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>عذراً، الرابط الذي طلبته غير متوفر</p>
    <a href="/" class="btn">← العودة للرئيسية</a>
  </div>
</body>
</html>
